name: Apply reviewed typography implementation
on:
  push:
    branches: ['work/typography-consistency-20261013']
    paths: ['.github/workflows/typography-apply.yml', 'scripts/typography-apply-payload/**']
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/work/typography-consistency-20261013'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify and apply the reviewed source patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,lzma,hashlib,subprocess
          data=''.join(p.read_text().strip() for p in sorted(Path('scripts/typography-apply-payload').glob('*.b64')))
          patch=lzma.decompress(base64.b64decode(data,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='8653391b96b9a2bbe301fd7b5adb912272b65f8bbd87c9a5bad2586caddaedc1'
          target=Path('/tmp/typography-reviewed.patch');target.write_bytes(patch)
          subprocess.run(['git','apply','--check','--unidiff-zero',str(target)],check=True)
          subprocess.run(['git','apply','--unidiff-zero',str(target)],check=True)
          PY
      - name: Install pinned source dependencies and generate metadata
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit
          npm ci
          python3 -m pip install 'fonttools==4.61.1' brotli
          python3 scripts/typography-build-manifest.py
          python3 scripts/typography-build-manifest.py --check
      - name: Commit implementation only to the authorized feature branch
        run: |
          test "$(git ls-remote origin refs/heads/work/typography-consistency-20261013 | cut -f1)" = "$GITHUB_SHA"
          git add package.json package-lock.json src/core/types.ts src/core/font-contract* src/index.css src/main.tsx src/regions/asia/korea.ts src/templates src/ui/App.tsx src/ui/Inspector.tsx src/ui/PlateView.tsx src/ui/ResearchDiesToggle.tsx src/ui/TypographyCoverage.tsx src/ui/embedded-assets* src/ui/export-policy.ts src/ui/exporting.ts src/ui/font-inspection* src/ui/font-loading.ts scripts/typography-build-manifest.py scripts/typography-verify.mjs scripts/typography-package-pins.json scripts/typography-geometry-baseline.json docs/research/typography-consistency public/data/typography
          git config user.name 'PlateForge typography builder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: make typography identities, source versions and exports reproducible'
          git push origin HEAD:refs/heads/work/typography-consistency-20261013
          mkdir -p typography-evidence
          git rev-parse HEAD > typography-evidence/commit.txt
      - name: Typecheck
        id: types
        continue-on-error: true
        run: npm run typecheck 2>&1 | tee typography-evidence/typecheck.log
      - name: Full tests and all-format coverage
        id: tests
        continue-on-error: true
        run: TYPOGRAPHY_EVIDENCE=1 npm test -- --maxWorkers=2 2>&1 | tee typography-evidence/tests.log
      - name: Production build
        id: build
        continue-on-error: true
        run: BASE_PATH=/plateforge/ npm run build 2>&1 | tee typography-evidence/build.log
      - name: Source and geometry integrity
        id: integrity
        continue-on-error: true
        run: node scripts/typography-verify.mjs 2>&1 | tee typography-evidence/integrity.log
      - name: Save metadata and dependency review
        if: always()
        run: |
          mkdir -p typography-evidence
          cp docs/research/typography-consistency/*inventory.json typography-evidence/ || true
          cp src/templates/font-manifest.json typography-evidence/ || true
          npm audit --json > typography-evidence/dependency-audit.json || true
          git show --format=fuller --stat HEAD > typography-evidence/change-summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typography-implementation-evidence
          path: typography-evidence/
          retention-days: 7
      - name: Require all checks
        if: always()
        env:
          TYPES: ${{ steps.types.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
          INTEGRITY: ${{ steps.integrity.outcome }}
        run: test "$TYPES:$TESTS:$BUILD:$INTEGRITY" = 'success:success:success:success'
