name: Cold font readiness verification
on:
  push:
    branches: ['work/typography-consistency-20261013']
    paths: ['.github/workflows/typography-cold-diagnostic.yml','scripts/typography-font-cold-diagnostics.ts']
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode: ['fontface','iframe','hidden']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: |
          npm ci
          npm install --prefix "$RUNNER_TEMP/typography-browser" --ignore-scripts --no-audit --save-exact playwright@1.56.1 pngjs@7.0.0
          node "$RUNNER_TEMP/typography-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Cold first export only
        env:
          TYPOGRAPHY_BROWSER_DEPS: ${{ runner.temp }}/typography-browser/package.json
          DIAGNOSTIC_MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          printf '\nimport "./typography-font-cold-diagnostics";\n' >> scripts/typography-browser-harness.tsx
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/typography-browser.mjs');s=p.read_text();start=s.index(' const formats=await page.evaluate');end=s.index(' await context.close();',start)
          s=s[:start]+''' const samples=[['cn','Noto Sans SC','京粤警学港澳使领',700],['jp','Noto Sans JP','品川横浜なあ東京',600],['kr','Noto Sans KR','서울경기가허하호',700],['antonio','Antonio','ĀČŁŐŞȚŽ 0123',500],['uk','UKNumberPlate, "Barlow Condensed"','AB-123',400]];
           for(const [name,family,text,weight] of samples){
             await page.evaluate(a=>window.typographyQA.specimen(...a),[family,text,weight]);
             const inline=await page.locator('#plate svg').screenshot();await writeFile(path.join(out,name+'-inline.png'),inline);
             const uri=await page.evaluate(mode=>window.coldFontRaster(mode),process.env.DIAGNOSTIC_MODE);
             const png=Buffer.from(uri.split(',')[1],'base64');const delta=pixels(inline,png);await writeFile(path.join(out,name+'-'+process.env.DIAGNOSTIC_MODE+'.png'),png);
             results.checks.push({name,mode:process.env.DIAGNOSTIC_MODE,delta});
           }
          '''+s[end:];p.write_text(s)
          PY
          node scripts/typography-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typography-cold-${{ matrix.mode }}
          path: typography-evidence/
          retention-days: 7
