name: Compare Iraq and Iran typography
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Install isolated comparison dependencies
        run: python -m pip install fonttools==4.59.1 pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.12.0.88 cairosvg==2.8.2
      - name: Render candidates and calculate specimen-specific diagnostics
        run: python scripts/compare-westasia-suite.py
      - name: Check report for missing images and embedded fonts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('public/typography-review')
          assert (p/'results.json').exists()
          assert (p/'offline.html').exists()
          for f in p.rglob('*'):
              if f.is_file(): assert f.suffix in {'.html','.json','.png'}, f
          text=(p/'index.html').read_text()
          offline=(p/'offline.html').read_text()
          assert '@font-face' not in text+offline and 'data:font' not in text+offline
          for src in re.findall(r'src="([^"]+)"',text): assert (p/src).is_file(),src
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: typography-reference-comparison
          path: public/typography-review/
          retention-days: 30
