name: Compare Iraq and Iran typography
on:
  pull_request:
    paths:
      - 'scripts/compare-westasia-fonts.py'
      - '.github/workflows/compare-westasia-fonts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HEAD_REF: ${{ github.head_ref }}
      INPUT_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Install isolated comparison dependencies
        run: python -m pip install fonttools==4.59.1 pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.12.0.88 cairosvg==2.8.2
      - name: Render candidates and calculate specimen-specific diagnostics
        run: python scripts/compare-westasia-fonts.py
      - name: Check report for missing images and embedded fonts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('public/typography-review')
          assert (p/'results.json').exists()
          for f in p.rglob('*'):
              if f.is_file(): assert f.suffix in {'.html','.json','.png'}, f
          text=(p/'index.html').read_text()
          assert '@font-face' not in text and 'data:font' not in text
          for src in re.findall(r'src="([^"]+)"',text): assert (p/src).is_file(),src
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: typography-reference-comparison
          path: public/typography-review/
          retention-days: 30
      - name: Retain only raster and report outputs on the same draft branch
        run: |
          # Do not overwrite concurrent edits or write to the default branch.
          test "$HEAD_REF" = 'feat/iraq-iran-source-aware'
          git fetch origin "$HEAD_REF"
          if [ "$(git rev-parse FETCH_HEAD)" != "$INPUT_SHA" ]; then
            echo 'Branch moved during comparison. Report remains available as the workflow artifact.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/typography-review
          if ! git diff --cached --quiet; then
            git commit -m 'Retain font-free typography comparison sheets and measured evidence'
            git push origin "HEAD:$HEAD_REF"
          fi
