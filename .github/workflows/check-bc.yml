name: Check plate systems

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/data/**'
      - 'public/typography-review/**'
      - 'scripts/**'
      - 'package*.json'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - '.github/workflows/check-bc.yml'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install isolated browser-test tooling
        run: npm install --no-save --package-lock=false playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - name: Check typography and every B.C. format in the built application
        run: node scripts/lettering-smoke.mjs
      - name: Check reference library and source-to-editor navigation
        run: node scripts/reference-library-smoke.mjs
      - name: Check Iraq and Iran font comparisons, including offline use
        run: node scripts/typography-review-smoke.mjs
      - name: Retain application screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-library-screenshots
          path: test-results/reference-library/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain typography report and browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typography-review-and-screenshots
          path: |
            public/typography-review/
            test-results/typography/
          if-no-files-found: ignore
          retention-days: 30
