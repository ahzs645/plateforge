name: Typography source inspection
on:
  push:
    branches: ['work/typography-consistency-20261013']
    paths: ['.github/workflows/typography-sources.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve and inspect published source packages
        run: |
          mkdir -p typography-source-evidence
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import {writeFileSync} from 'node:fs';
          const names=['noto-sans-sc','noto-sans-jp','noto-sans-kr','noto-sans-canadian-aboriginal','noto-sans','noto-serif','pinyon-script'];
          const pinned=names.map(n=>{const pkg='@fontsource/'+n;const version=execFileSync('npm',['view',pkg,'version'],{encoding:'utf8'}).trim();return {package:pkg,version};});
          writeFileSync('typography-source-evidence/packages.json',JSON.stringify(pinned,null,2));
          execFileSync('npm',['install','--prefix',process.env.RUNNER_TEMP+'/font-inspection','--ignore-scripts','--no-audit','--save-exact',...pinned.map(p=>p.package+'@'+p.version)],{stdio:'inherit'});
          JS
      - name: Inspect font names, glyph coverage and subset descriptors without distributing fonts
        run: |
          python3 -m pip install 'fonttools==4.61.1' brotli
          python3 - <<'PY'
          import os, json, re, hashlib
          from pathlib import Path
          from fontTools.ttLib import TTFont
          root=Path(os.environ['RUNNER_TEMP'])/'font-inspection/node_modules/@fontsource'
          out=Path('typography-source-evidence');fonts=[]
          for pkg in sorted(root.iterdir()):
              dest=out/pkg.name;dest.mkdir()
              for name in ['package.json','metadata.json','unicode.json','LICENSE','LICENSE.md','OFL.txt']:
                  p=pkg/name
                  if p.is_file(): (dest/name).write_bytes(p.read_bytes())
              styles=['600.css'] if pkg.name=='noto-sans-jp' else ['700.css'] if pkg.name in ['noto-sans-sc','noto-sans-kr','noto-sans-canadian-aboriginal'] else ['400.css'] if pkg.name=='pinyon-script' else ['400.css','700.css','400-italic.css','700-italic.css']
              needed=set()
              for style in styles:
                  p=pkg/style
                  if not p.exists(): raise RuntimeError(str(p))
                  text=p.read_text();(dest/style).write_text(text)
                  needed.update(re.findall(r'url\((?:\./)?(files/[^)]+\.woff2)\)',text))
              for name in sorted(needed):
                  p=pkg/name;f=TTFont(p);o=f['OS/2']
                  row={'path':'node_modules/@fontsource/'+pkg.name+'/'+name,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size,'names':{str(i):sorted({n.toUnicode() for n in f['name'].names if n.nameID==i}) for i in (1,2,3,4,5,6,8,9,11,13,14,16,17)},'unitsPerEm':f['head'].unitsPerEm,'glyphCount':len(f.getGlyphOrder()),'codepoints':sorted((f.getBestCmap() or {}).keys()),'fsType':o.fsType,'weightClass':o.usWeightClass,'capHeight':getattr(o,'sCapHeight',None)}
                  if 'fvar' in f: row['axes']=[{'tag':a.axisTag,'min':a.minValue,'default':a.defaultValue,'max':a.maxValue} for a in f['fvar'].axes]
                  fonts.append(row);f.close()
          (out/'font-metadata.json').write_text(json.dumps(fonts,ensure_ascii=False,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typography-source-evidence
          path: typography-source-evidence/
          retention-days: 7
