name: Check Iraq and Iran plates
on:
  pull_request:
    paths:
      - 'src/regions/asia/**'
      - 'src/templates/**'
      - 'src/regions/index.ts'
      - 'src/core/**'
      - 'scripts/build-iraq-iran-preview.mjs'
      - '.github/workflows/check-iraq-iran.yml'
      - 'package*.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/build-iraq-iran-preview.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: iraq-iran-review
          path: preview/iraq-iran.html
